<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Manager & Test Bench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        
        .view-hidden { display: none !important; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="max-w-[1400px] mx-auto w-full p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
        
        <header class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-5 transition-all">
            <div class="w-full md:w-auto">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Dataset Manager</h1>
                <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">Kelola dataset spesifik dan jalankan uji benchmark IndoBERT dengan mudah.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <button id="btn-show-manager" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors focus:ring-2 focus:ring-slate-300 focus:outline-none flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Daftar Dataset
                </button>
                <a href="/" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors focus:ring-2 focus:ring-rose-200 focus:outline-none shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard
                </a>
            </div>
        </header>

        <main id="view-dataset-list" class="bg-white md:rounded-2xl md:shadow-sm md:border border-slate-200 flex flex-col bg-transparent md:bg-white border-none">
            <div class="p-0 pb-4 md:p-6 md:border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h2 class="text-lg font-bold text-slate-800 hidden md:block">Available Datasets</h2>
                
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                    <button id="btn-copy-all-stats" class="w-full sm:w-auto bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-3 md:py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none flex items-center justify-center gap-2" title="Salin total sebaran keseluruhan data mentah di database">
                        <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Salin Sebaran Semua Tweet
                    </button>
                    <button id="btn-create-dataset" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 md:py-2.5 rounded-xl text-sm font-bold transition-all shadow-md hover:shadow-lg focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:outline-none flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Create New Dataset
                    </button>
                    <button id="btn-test-all" class="w-full sm:w-auto bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300 px-5 py-3 md:py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none flex items-center justify-center gap-2">
    <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
    Test All Datasets
</button>
                </div>
            </div>
            
            <div class="w-full relative">
                <table class="w-full text-left text-sm border-collapse block md:table">
                    <thead class="hidden md:table-header-group bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                        <tr>
                            <th class="py-4 px-6 font-bold w-1/4">Nama Dataset</th>
                            <th class="py-4 px-6 font-bold w-1/3">Deskripsi</th>
                            <th class="py-4 px-6 font-bold w-1/6">Dibuat Pada</th>
                            <th class="py-4 px-6 font-bold text-center w-1/4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataset-table-body" class="block md:table-row-group space-y-4 md:space-y-0 divide-y-0 md:divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </main>

        <main id="view-dataset-editor" class="view-hidden flex flex-col gap-6">
            
            <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 border-t-4 border-t-emerald-500">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                    <div>
                        <label for="input-dataset-name" class="block text-sm font-bold text-slate-700 mb-2">Nama Dataset</label>
                        <input type="text" id="input-dataset-name" placeholder="e.g., Q1 Complaint Data" class="bg-slate-50 border border-slate-200 text-slate-900 text-base md:text-sm font-semibold rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white block w-full px-4 py-3.5 md:py-3 outline-none transition-all placeholder:text-slate-400">
                    </div>
                    <div>
                        <label for="input-dataset-desc" class="block text-sm font-bold text-slate-700 mb-2">Deskripsi</label>
                        <input type="text" id="input-dataset-desc" placeholder="Konteks opsional mengenai dataset ini..." class="bg-slate-50 border border-slate-200 text-slate-900 text-base md:text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white block w-full px-4 py-3.5 md:py-3 outline-none transition-all placeholder:text-slate-400">
                    </div>
                </div>

                <div class="flex flex-col xl:flex-row gap-4 pt-5 border-t border-slate-100 items-start xl:items-center justify-between">
                    <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto">
                        <div class="relative w-full md:w-72">
                            <input type="text" id="filter-search" placeholder="Cari isi cuitan..." class="bg-slate-50 border border-slate-200 text-slate-700 text-base md:text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white block w-full px-4 py-3 md:py-2.5 pl-11 md:pl-10 outline-none transition-all h-full">
                            <svg class="w-5 h-5 md:w-4 md:h-4 text-slate-400 absolute left-3.5 top-3.5 md:top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                            <select id="filter-status" class="w-full sm:flex-none bg-slate-50 border border-slate-200 text-slate-700 text-base md:text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block px-4 py-3 md:py-2.5 outline-none cursor-pointer transition-colors appearance-none pr-10 relative bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] md:bg-[position:right_0.5rem_center] bg-[length:1.2em_1.2em]">
                                <option value="">Semua Status</option>
                                <option value="unlabeled">Belum Dilabeli</option>
                                <option value="labeled">Sudah Dilabeli</option>
                            </select>
                            
                            <select id="filter-month" class="w-full sm:flex-none bg-slate-50 border border-slate-200 text-slate-700 text-base md:text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 block px-4 py-3 md:py-2.5 outline-none cursor-pointer transition-colors appearance-none pr-10 relative bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] md:bg-[position:right_0.5rem_center] bg-[length:1.2em_1.2em]">
                                <option value="">Semua Periode</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 w-full xl:w-auto pt-4 xl:pt-0 border-t border-slate-100 xl:border-none mt-2 xl:mt-0">
                        
                        <div class="flex gap-2">
                            <button id="btn-copy-summary" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-3 md:py-2.5 rounded-xl text-base md:text-sm font-bold transition-all shadow-sm flex items-center justify-center gap-2 whitespace-nowrap focus:ring-2 focus:ring-indigo-200 focus:outline-none" title="Salin angka sebaran per bulan saja">
                                <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Salin Rekap
                            </button>
                            <button id="btn-copy-full" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-3 md:py-2.5 rounded-xl text-base md:text-sm font-bold transition-all shadow-sm flex items-center justify-center gap-2 whitespace-nowrap focus:ring-2 focus:ring-indigo-200 focus:outline-none" title="Salin rekap beserta isi teks tweet-nya">
                                <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012 2m-5 4h6m-6 4h6m-6 4h5"></path></svg>
                                Salin Semua
                            </button>
                        </div>

                        <div class="relative w-full sm:w-auto">
                            <button id="btn-label-counter" class="w-full sm:w-auto text-emerald-700 font-bold bg-emerald-50 hover:bg-emerald-100 px-4 py-3 md:py-2.5 rounded-xl border border-emerald-200 flex items-center justify-center whitespace-nowrap gap-2 transition-colors focus:ring-2 focus:ring-emerald-300 focus:outline-none relative">
                                <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span id="label-counter-text">0 Data Labeled</span>
                            </button>

                            <div id="session-stats-dropdown" class="hidden absolute bottom-full sm:bottom-auto sm:top-full mb-2 sm:mb-0 sm:mt-2 right-0 w-full sm:w-64 bg-white rounded-2xl shadow-xl border border-slate-200 z-50 overflow-hidden transition-all origin-bottom sm:origin-top-right">
                                <div class="p-3 border-b border-slate-100 bg-slate-50">
                                    <h3 class="font-bold text-slate-800 text-xs uppercase tracking-wider text-center">Sebaran Porsi Bulan Ini</h3>
                                </div>
                                <div class="max-h-64 overflow-y-auto custom-scrollbar p-2" id="session-stats-content">
                                    </div>
                            </div>
                        </div>
                        
                        <button id="btn-save-dataset" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 md:py-2.5 rounded-xl text-base md:text-sm font-bold transition-all shadow-md hover:shadow-lg focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:outline-none flex items-center justify-center gap-2 whitespace-nowrap">
                            <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Simpan Dataset
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-transparent md:bg-white md:rounded-2xl md:shadow-sm md:border border-slate-200 flex flex-col overflow-hidden">
                <div class="md:overflow-y-auto custom-scrollbar md:max-h-[700px] relative">
                    <table class="w-full text-left border-collapse text-sm block md:table">
                        <thead class="hidden md:table-header-group bg-slate-50 text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200">
                            <tr>
                                <th class="py-4 px-6 w-16 text-center text-xs uppercase tracking-wider">ID</th>
                                <th class="py-4 px-6 text-xs uppercase tracking-wider">Isi Teks (Raw Content)</th>
                                <th class="py-4 px-6 w-80 text-center text-xs uppercase tracking-wider">Assign Label</th>
                            </tr>
                        </thead>
                        <tbody id="annotation-table-body" class="block md:table-row-group space-y-5 md:space-y-0 pb-4 md:pb-0 divide-y-0 md:divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
                
                <div class="p-4 sm:p-5 bg-white md:bg-slate-50 rounded-2xl md:rounded-none shadow-sm md:shadow-none border border-slate-200 md:border-none flex justify-between items-center md:border-t md:border-slate-200 mt-2 md:mt-0">
    <button id="btn-prev-page" class="px-4 md:px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100 focus:ring-2 focus:ring-slate-200 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">Prev</button>
    
    <div class="flex items-center gap-2 bg-slate-50 md:bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
        <span class="text-sm font-semibold text-slate-600 hidden sm:inline">Halaman</span>
        <input type="number" id="input-page-jump" min="1" class="w-16 text-center text-sm font-bold text-emerald-700 bg-white border border-slate-300 rounded-md py-1.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-inner" value="1">
        <span class="text-sm font-semibold text-slate-600">dari <span id="page-total">1</span></span>
    </div>

    <button id="btn-next-page" class="px-4 md:px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-100 focus:ring-2 focus:ring-slate-200 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">Next</button>
</div>
            </div>
        </main>
    </div>

    <template id="tpl-dataset-row">
        <tr class="block md:table-row bg-white md:bg-transparent border border-slate-200 md:border-none rounded-2xl md:rounded-none p-0 hover:bg-slate-50 transition-colors group overflow-hidden shadow-sm md:shadow-none relative">
            <td class="block md:table-cell py-4 px-5 md:py-4 md:px-6 font-bold text-slate-800 row-name align-top sm:align-middle text-base md:text-sm"></td>
            <td class="block md:table-cell py-0 px-5 md:py-4 md:px-6 text-slate-500 row-desc align-top sm:align-middle pb-2 md:pb-4">
                <span class="line-clamp-2 leading-relaxed"></span>
            </td>
            <td class="block md:table-cell py-2 px-5 md:py-4 md:px-6 text-slate-400 text-xs font-medium row-date align-top sm:align-middle whitespace-nowrap before:content-['Dibuat:_'] md:before:content-none border-b border-slate-50 md:border-none pb-4 md:pb-4"></td>
            <td class="block md:table-cell py-4 px-5 md:py-4 md:px-6 text-center align-top sm:align-middle bg-slate-50 md:bg-transparent">
                <div class="flex flex-wrap justify-start md:justify-center gap-2">
                    <button class="btn-test flex-1 md:flex-none justify-center items-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-4 py-2.5 md:py-2 rounded-xl md:rounded-lg text-sm md:text-xs font-bold transition-colors border border-emerald-100">
                        <svg class="w-3.5 h-3.5 pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        Test
                    </button>
                    <button class="btn-edit flex items-center gap-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 px-4 py-2.5 md:py-2 rounded-xl md:rounded-lg text-sm md:text-xs font-bold transition-colors border border-amber-100">
                        <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        Edit
                    </button>
                    <button class="btn-delete flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 px-4 py-2.5 md:py-2 rounded-xl md:rounded-lg text-sm md:text-xs font-bold transition-colors border border-rose-100">
                        <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Delete
                    </button>
                </div>
            </td>
        </tr>
    </template>

    <template id="tpl-annotation-row">
        <tr class="block md:table-row bg-white md:bg-transparent border border-slate-200 md:border-none rounded-2xl md:rounded-none shadow-sm md:shadow-none hover:bg-emerald-50/20 transition-colors border-b md:border-b-slate-100 group">
            <td class="block md:table-cell py-3 px-5 md:py-5 md:px-6 text-left md:text-center text-slate-500 md:text-slate-400 font-bold md:font-medium row-id align-top border-b border-slate-100 md:border-none bg-slate-50 md:bg-transparent rounded-t-2xl md:rounded-none text-xs before:content-['ID:_'] md:before:content-none tracking-wide"></td>
            
            <td class="block md:table-cell py-4 px-5 md:py-5 md:px-6 text-slate-700 row-content align-top leading-relaxed break-words text-base md:text-sm"></td>
            
            <td class="block md:table-cell p-4 md:py-5 md:px-6 align-top bg-slate-50/50 md:bg-transparent border-t border-slate-100 md:border-none rounded-b-2xl md:rounded-none">
                <div class="flex gap-2 justify-between md:justify-center w-full">
                    
                    <label class="flex-1 md:flex-none cursor-pointer">
                        <input type="radio" value="positive" class="peer sr-only label-radio">
                        <div class="flex items-center justify-center gap-1.5 px-3 py-3 md:py-2 md:px-4 border border-slate-200 rounded-xl text-slate-400 bg-white hover:bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 transition-all text-sm font-bold shadow-sm">
                            <svg class="w-6 h-6 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="hidden md:inline">Positive</span>
                        </div>
                    </label>
